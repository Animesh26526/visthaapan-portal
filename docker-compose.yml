services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: visthaapan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visthaapan}
      POSTGRES_USER: ${POSTGRES_USER:-visthaapan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visthaapan_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visthaapan} -d ${POSTGRES_DB:-visthaapan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visthaapan-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visthaapan}:${POSTGRES_PASSWORD:-visthaapan_dev}@postgres:5432/${POSTGRES_DB:-visthaapan}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: visthaapan_postgres_data
